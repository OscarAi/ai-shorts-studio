# Monthly pull requests that update the pinned libraries; the tests workflow checks each one.
# Merge only when the tests are green (same rule as updating by hand).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      libraries:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
